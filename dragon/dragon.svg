<svg width="1200" height="180" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="dragon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff512f"/>
      <stop offset="50%" stop-color="#dd2476"/>
      <stop offset="100%" stop-color="#7f00ff"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="180" fill="#0d1117" rx="15"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="80" cy="35" r="2"/>
    <circle cx="190" cy="80" r="1.5"/>
    <circle cx="350" cy="30" r="2"/>
    <circle cx="520" cy="70" r="1.5"/>
    <circle cx="700" cy="35" r="2"/>
    <circle cx="850" cy="85" r="1.5"/>
    <circle cx="1030" cy="40" r="2"/>
    <circle cx="1140" cy="90" r="1.5"/>
  </g>

  <!-- Contribution path -->
  <path
    d="M80 125
       C200 50 300 150 420 90
       S650 50 760 110
       S980 150 1120 60"
    fill="none"
    stroke="#30363d"
    stroke-width="3"
    stroke-dasharray="8 8"/>

  <!-- Dragon -->
  <g filter="url(#glow)">
    
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="42" ry="22" fill="url(#dragon)">
      <animateMotion
        dur="8s"
        repeatCount="indefinite"
        path="M80 125 C200 50 300 150 420 90 S650 50 760 110 S980 150 1120 60"/>
    </ellipse>

    <!-- Head -->
    <circle cx="38" cy="-5" r="16" fill="#ff512f">
      <animateMotion
        dur="8s"
        repeatCount="indefinite"
        path="M80 125 C200 50 300 150 420 90 S650 50 760 110 S980 150 1120 60"/>
      </animateMotion>
    </circle>

    <!-- Eye -->
    <circle cx="43" cy="-9" r="3" fill="#fff">
      <animateMotion
        dur="8s"
        repeatCount="indefinite"
        path="M80 125 C200 50 300 150 420 90 S650 50 760 110 S980 150 1120 60"/>
      </animateMotion>
    </circle>

    <!-- Wing -->
    <path
      d="M-10 -15 L-35 -50 L5 -30 Z"
      fill="#7f00ff">
      <animateMotion
        dur="8s"
        repeatCount="indefinite"
        path="M80 125 C200 50 300 150 420 90 S650 50 760 110 S980 150 1120 60"/>
      </animateMotion>
    </path>

    <!-- Tail -->
    <path
      d="M-35 5 Q-70 25 -85 5"
      fill="none"
      stroke="#dd2476"
      stroke-width="8"
      stroke-linecap="round">
      <animateMotion
        dur="8s"
        repeatCount="indefinite"
        path="M80 125 C200 50 300 150 420 90 S650 50 760 110 S980 150 1120 60"/>
      </animateMotion>
    </path>

  </g>

  <!-- Title -->
  <text
    x="600"
    y="165"
    text-anchor="middle"
    fill="#8b949e"
    font-family="Arial, sans-serif"
    font-size="14">
    🐉 Every contribution makes the dragon stronger
  </text>

</svg>
