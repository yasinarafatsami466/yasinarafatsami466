name: 🐉 Dragon Contribution Graph

on:

  workflow_dispatch:

  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:

  generate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Dragon Contribution Graph
        run: node generate-dragon.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Commit generated Dragon graph
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dragon/dragon.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else

            git commit \
              -m "🐉 Update Dragon contribution graph"

            git push

          fi
